name: RDP-LocalToNet-Fixed

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360  # Maximum GitHub runner time (6 hours)

    steps:
      - name: Configure Windows RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          
          # Open Firewall for Port 3389
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          
          # Restart RDP Service
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "P@ssword123!"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Setup LocalToNet Tunnel
        run: |
          # 1. Download the correct Windows x64 binary
          Invoke-WebRequest -Uri "https://localtonet.com" -OutFile "ltn.zip"
          
          # 2. Extract the ZIP
          Expand-Archive -Path "ltn.zip" -DestinationPath "."
          
          # 3. Register Auth Token (Using your provided token)
          ./localtonet.exe authtoken iFZOGech42E1d3NToSqvtaDw8yWjR7xbH
          
          # 4. Start TCP Tunnel for RDP in background
          Start-Process -FilePath "./localtonet.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          # Give it time to initialize
          Start-Sleep -Seconds 20

      - name: Connection Information
        run: |
          Write-Host "=========================================="
          Write-Host "RDP STATUS: ACTIVE"
          Write-Host "Username: RDPUser"
          Write-Host "Password: ${{ env.RDP_PASS }}"
          Write-Host "------------------------------------------"
          Write-Host "HOW TO CONNECT:"
          Write-Host "1. Log in to https://localtonet.com"
          Write-Host "2. Look for the 'Public Address' (e.g., connect.localtonet.com:12345)"
          Write-Host "3. Enter that address into your RDP/Windows App"
          Write-Host "=========================================="
          
          # Keep the session alive for 6 hours
          while ($true) { Start-Sleep -Seconds 300 }
