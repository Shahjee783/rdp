name: RDP-NetBird-Final

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows RDP
        run: |
          # Enable Remote Desktop and open Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "NetBird@RDP2024"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Connect to NetBird
        uses: netbirdio/netbird-action@v1
        with:
          # Using your provided Setup Key
          setup-key: "8E5FF2CC-8CD1-4668-A4CD-1EA2EB94AF93"

      - name: Connection Details
        run: |
          # Wait a moment for IP assignment
          Start-Sleep -Seconds 10
          
          Write-Host "=========================================="
          Write-Host "NETBIRD RDP IS ONLINE"
          Write-Host "Username: RDPUser"
          Write-Host "Password: ${{ env.RDP_PASS }}"
          Write-Host "------------------------------------------"
          Write-Host "TO CONNECT:"
          Write-Host "1. Install NetBird on your device and log in."
          Write-Host "2. Go to https://app.netbird.io"
          Write-Host "3. Copy the IP of the 'windows-latest' machine."
          Write-Host "4. Use that IP in your RDP App."
          Write-Host "=========================================="
          
          # Keep session active
          while ($true) {
              Write-Host "Keep-Alive: $(Get-Date)"
              Start-Sleep -Seconds 300
          }
